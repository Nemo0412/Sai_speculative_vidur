# Model Configuration File for Vidur Simulator
# You can add or modify model configurations here
# All parameters are explicitly defined for easy customization

models:
  # Llama-2 Models
  "meta-llama/Llama-2-7b-hf":
    num_layers: 32
    num_q_heads: 32
    num_kv_heads: 32
    embedding_dim: 4096
    mlp_hidden_dim: 11008
    max_position_embeddings: 4096
    use_gated_mlp: true
    use_bias: false
    use_qkv_bias: false
    activation: "silu"
    norm: "rms_norm"
    post_attn_norm: true
    vocab_size: 32768
    is_neox_style: true
    rope_theta: 10000.0
    rope_scaling: null
    partial_rotary_factor: 1.0
    no_tensor_parallel: false

